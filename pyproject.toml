[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alvance-github-crawler"
version = "0.1.0"
description = "GitHub repository collection and verification pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0,<3",
  "pydantic>=2.8,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
e2b = ["e2b>=2.3,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9"]

[project.scripts]
alvance-github-crawler = "alvance_github_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

